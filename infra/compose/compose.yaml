# Souqly — environnement local complet.
#   cp infra/compose/.env.example infra/compose/.env
#   docker compose -f infra/compose/compose.yaml up -d --build --wait
# Socle : bases, Keycloak, Kafka (KRaft), services, passerelle.
# Observabilité (profil « observability ») : docker compose --profile observability up -d  →  Grafana http://localhost:3000
# Kafka UI (profil « tools ») : docker compose --profile tools up -d  →  http://localhost:8085
# Comptes de démonstration (realm souqly) : sara (client), fatima et karim (vendeurs), admin-souqly.
name: souqly

x-service-defaults: &service-defaults
  restart: unless-stopped
  env_file: .env
  environment: &service-env
    ASPNETCORE_ENVIRONMENT: Development
    # Les jetons sont émis pour http://localhost:8180 (navigateur) ; les services lisent les clés via le réseau interne.
    Authentication__Authority: http://localhost:8180/realms/souqly
    Authentication__MetadataAddress: http://keycloak:8080/realms/souqly/.well-known/openid-configuration
    ConnectionStrings__Kafka: kafka:9092
    # Traces, métriques, logs → Grafana (profil observability ; sans lui, rien n'est envoyé avec succès, sans effet sur le service)
    Telemetry__GrafanaEndpoint: http://grafana:4317
    Database__MigrateOnStartup: "true"
  healthcheck:
    interval: 10s
    timeout: 3s
    start_period: 20s
    retries: 6
  mem_limit: 384m

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      ORDERING_DB_PASSWORD: ${ORDERING_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "5432:5432"   # débogage uniquement
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?définir KEYCLOAK_ADMIN_PASSWORD dans .env}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      ORDERING_CLIENT_SECRET: ${ORDERING_CLIENT_SECRET}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"   # page de connexion (navigateur) et émetteur des jetons
    healthcheck:
      # L'image n'a ni curl ni wget : requête HTTP brute sur le port de gestion.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    mem_limit: 768m

  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    environment:
      # Un seul nœud KRaft (contrôleur + broker), sans ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 10
    mem_limit: 1g

  grafana:
    image: grafana/otel-lgtm:0.41.1   # Grafana + Prometheus + Tempo + Loki + collecteur OpenTelemetry
    profiles: ["observability"]
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/souqly/souqly-overview.json
    volumes:
      - ../grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/souqly:ro
      - ../grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/souqly.yaml:ro
      - ../grafana/provisioning/alerting:/otel-lgtm/grafana/conf/provisioning/alerting:ro
      - grafana-data:/data
    ports:
      - "3000:3000"
    mem_limit: 1500m

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["tools"]
    environment:
      KAFKA_CLUSTERS_0_NAME: souqly
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8085:8080"
    depends_on:
      kafka: { condition: service_healthy }

  catalog:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Catalog/Souqly.Catalog.Api/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-souqly}/souqly-catalog:${SOUQLY_VERSION:-dev}
    environment:
      <<: *service-env
      ConnectionStrings__CatalogDb: Host=postgres;Database=catalog_db;Username=catalog;Password=${CATALOG_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "dotnet", "Souqly.Catalog.Api.dll", "--healthcheck"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  inventory:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Inventory/Souqly.Inventory.Api/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-souqly}/souqly-inventory:${SOUQLY_VERSION:-dev}
    environment:
      <<: *service-env
      ConnectionStrings__InventoryDb: Host=postgres;Database=inventory_db;Username=inventory;Password=${INVENTORY_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "dotnet", "Souqly.Inventory.Api.dll", "--healthcheck"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      kafka: { condition: service_healthy }

  cart:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Cart/Souqly.Cart.Api/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-souqly}/souqly-cart:${SOUQLY_VERSION:-dev}
    environment:
      <<: *service-env
      ConnectionStrings__Redis: redis:6379,abortConnect=false
    healthcheck:
      test: ["CMD", "dotnet", "Souqly.Cart.Api.dll", "--healthcheck"]
    depends_on:
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  ordering:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Ordering/Souqly.Ordering.Api/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-souqly}/souqly-ordering:${SOUQLY_VERSION:-dev}
    environment:
      <<: *service-env
      ConnectionStrings__OrderDb: Host=postgres;Database=ordering_db;Username=ordering;Password=${ORDERING_DB_PASSWORD}
      Catalog__BaseAddress: http://catalog:8080
      ServiceAccount__TokenEndpoint: http://keycloak:8080/realms/souqly/protocol/openid-connect/token
      ServiceAccount__ClientSecret: ${ORDERING_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "dotnet", "Souqly.Ordering.Api.dll", "--healthcheck"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      kafka: { condition: service_healthy }
      catalog: { condition: service_healthy }

  payment:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Payment/Souqly.Payment.Api/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-souqly}/souqly-payment:${SOUQLY_VERSION:-dev}
    environment:
      <<: *service-env
      ConnectionStrings__PaymentDb: Host=postgres;Database=payment_db;Username=payment;Password=${PAYMENT_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "dotnet", "Souqly.Payment.Api.dll", "--healthcheck"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      kafka: { condition: service_healthy }

  notification:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/Notification/Souqly.Notification.Api/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-souqly}/souqly-notification:${SOUQLY_VERSION:-dev}
    environment:
      <<: *service-env
      ConnectionStrings__NotificationDb: Host=postgres;Database=notification_db;Username=notification;Password=${NOTIFICATION_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "dotnet", "Souqly.Notification.Api.dll", "--healthcheck"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      kafka: { condition: service_healthy }

  gateway:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: src/Services/ApiGateway/Souqly.ApiGateway/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-souqly}/souqly-gateway:${SOUQLY_VERSION:-dev}
    environment:
      <<: *service-env
      ReverseProxy__Clusters__catalog__Destinations__d1__Address: http://catalog:8080
      ReverseProxy__Clusters__inventory__Destinations__d1__Address: http://inventory:8080
      ReverseProxy__Clusters__cart__Destinations__d1__Address: http://cart:8080
      ReverseProxy__Clusters__ordering__Destinations__d1__Address: http://ordering:8080
      ReverseProxy__Clusters__payment__Destinations__d1__Address: http://payment:8080
      ReverseProxy__Clusters__notification__Destinations__d1__Address: http://notification:8080
    healthcheck:
      test: ["CMD", "dotnet", "Souqly.ApiGateway.dll", "--healthcheck"]
    ports:
      - "8080:8080"   # seul point d'entrée exposé : les services métier restent sur le réseau interne
    depends_on:
      catalog: { condition: service_healthy }
      inventory: { condition: service_healthy }
      cart: { condition: service_healthy }
      ordering: { condition: service_healthy }
      payment: { condition: service_healthy }
      notification: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  keycloak-data:
  kafka-data:
  grafana-data:
