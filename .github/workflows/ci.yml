name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restaurer
        run: dotnet restore Souqly.slnx

      - name: Vérifier le formatage
        run: dotnet format Souqly.slnx --verify-no-changes --no-restore

      - name: Compiler (avertissements = erreurs)
        run: dotnet build Souqly.slnx --no-restore -c Release

      - name: Tester avec couverture
        run: >
          dotnet test Souqly.slnx --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx;LogFilePrefix=results"

      - name: Rapport de couverture
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub;Cobertura"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rapport Gherkin (scénarios OK/KO)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-report
          path: artifacts/gherkin-report.json
          if-no-files-found: ignore

  deploiement:
    # Chart Helm valide (lint + schémas Kubernetes) et scripts k6 lisibles par k6.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Vérifier le chart Helm
        run: |
          helm lint deploy/helm/souqly --strict
          helm lint deploy/helm/souqly --strict -f deploy/helm/souqly/values-demo.yaml

      - name: Valider les manifestes (kubeconform)
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template souqly deploy/helm/souqly | ./kubeconform -strict -summary -kubernetes-version 1.31.0
          helm template souqly deploy/helm/souqly -f deploy/helm/souqly/values-demo.yaml | ./kubeconform -strict -summary -kubernetes-version 1.31.0

      - uses: grafana/setup-k6-action@v1

      - name: Vérifier les scripts k6
        run: |
          for p in fumee charge pic; do k6 inspect -e PROFILE=$p tests/load/souqly.js > /dev/null && echo "k6 $p : OK"; done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
