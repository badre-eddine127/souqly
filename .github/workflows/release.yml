name: release

# Une étiquette vX.Y.Z publie les images des 9 services et le chart Helm sur GHCR.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, dockerfile: src/Services/ApiGateway/Souqly.ApiGateway/Dockerfile }
          - { name: web, dockerfile: src/Web/Souqly.Web/Dockerfile }
          - { name: catalog, dockerfile: src/Services/Catalog/Souqly.Catalog.Api/Dockerfile }
          - { name: inventory, dockerfile: src/Services/Inventory/Souqly.Inventory.Api/Dockerfile }
          - { name: cart, dockerfile: src/Services/Cart/Souqly.Cart.Api/Dockerfile }
          - { name: ordering, dockerfile: src/Services/Ordering/Souqly.Ordering.Api/Dockerfile }
          - { name: payment, dockerfile: src/Services/Payment/Souqly.Payment.Api/Dockerfile }
          - { name: notification, dockerfile: src/Services/Notification/Souqly.Notification.Api/Dockerfile }
          - { name: search, dockerfile: src/Services/Search/Souqly.Search.Api/Dockerfile }
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/souqly-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construire et publier
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Publier le chart (OCI)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/souqly --version "${VERSION#v}" --app-version "${VERSION#v}"
          helm push "souqly-${VERSION#v}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
