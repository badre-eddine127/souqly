{{- if .Values.secrets.create }}
# Démonstration uniquement : en production le Secret est créé hors du chart (secrets.create=false).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "souqly.labels" . | nindent 4 }}
    {{- include "souqly.instanceLabel" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ required (printf "secrets.values.%s est obligatoire quand secrets.create=true" $key) $value | quote }}
  {{- end }}
{{- end }}
